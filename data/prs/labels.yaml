# Ground truth for the eval harness (eval/run_eval.py).
# An issue counts as found when a blocker/major/minor finding has the same file, one of the listed
# categories, and a line within +/-3 of `line`.
# `rule_detectable: false` marks issues that need reasoning (logic bugs, spec gaps) - the offline
# baseline is expected to miss these; they are what the LLM reviewer is for.

pr01_jwt_good:
  spec: day12_jwt_auth
  verdict: approve
  issues: []

pr02_jwt_insecure:
  spec: day12_jwt_auth
  verdict: request_changes
  issues:
    - {id: hardcoded-secret, file: app/auth/security.py, line: 8, categories: [security], rule_detectable: true}
    - {id: no-exp, file: app/auth/security.py, line: 13, categories: [security], rule_detectable: true}
    - {id: bare-except, file: app/auth/security.py, line: 19, categories: [correctness], rule_detectable: true}
    - {id: wrong-status-403, file: app/auth/security.py, line: 20, categories: [correctness, spec], rule_detectable: false}
    - {id: debug-print, file: app/auth/security.py, line: 21, categories: [hygiene, security], rule_detectable: true}
    - {id: plaintext-password, file: app/auth/security.py, line: 26, categories: [security], rule_detectable: true}
    - {id: login-400-not-401, file: app/routers/auth.py, line: 14, categories: [correctness, spec], rule_detectable: false}
    - {id: no-tests, file: app/auth/security.py, line: 1, categories: [testing], rule_detectable: true, any_line: true}

